# Test profile: an in-memory H2 database with the schema generated directly
# from the JPA entities. Flyway's migrations use Postgres-specific SQL
# (pgcrypto, TIMESTAMPTZ) and aren't run here - ddl-auto derives a compatible
# schema instead, which is all @SpringBootTest/@DataJpaTest need.
spring:
  datasource:
    url: jdbc:h2:mem:dbwb-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

  mail:
    host: localhost
    port: 2525

dbwb:
  jwt:
    secret: test-only-secret-not-for-production-use-0123456789
    access-token-ttl-minutes: 60

  cors:
    allowed-origins: http://localhost:3000

  business-rules:
    subscription-grace-period-days: 3
    account-deletion-disable-window-days: 30
    website-trash-retention-days: 30
    menu-item-trash-retention-days: 7
    website-public-load-target-seconds: 3
    email-verification-token-ttl-hours: 24
    password-reset-token-ttl-minutes: 30
    maintenance-job-interval-ms: 3600000

  frontend:
    public-site-base-url: http://localhost:3000

  support:
    notification-email: support@example.com

  admin:
    bootstrap-email:
    bootstrap-password:
