# Test profile: an in-memory H2 database with the schema generated directly
# from the JPA entities. Flyway's migrations use Postgres-specific SQL
# (pgcrypto, TIMESTAMPTZ) and aren't run here - ddl-auto derives a compatible
# schema instead, which is all @SpringBootTest/@DataJpaTest need.
spring:
  datasource:
    url: jdbc:h2:mem:dbwb-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    # Production sets this too. Left at Spring's default, tests ran with an
    # open session that quietly resolved lazy associations the real app would
    # have thrown LazyInitializationException on.
    open-in-view: false

  flyway:
    enabled: false

  mail:
    host: localhost
    port: 2525

dbwb:
  jwt:
    secret: test-only-secret-not-for-production-use-0123456789
    access-token-ttl-minutes: 60

  cors:
    allowed-origins: http://localhost:3000

  # Every key application.yml defines is repeated here, in the same order.
  # A key present there and missing here binds to 0/null under test, which is
  # how the zero-day-trial bug reached production looking tested: nothing here
  # set subscription-trial-days, so the trial window under test was never the
  # one real users got. Adding a rule in application.yml means adding it here.
  business-rules:
    subscription-grace-period-days: 3
    subscription-trial-days: 10
    default-websites-per-owner: 3
    account-deletion-disable-window-days: 30
    website-trash-retention-days: 30
    menu-item-trash-retention-days: 7
    analytics-event-retention-days: 365
    website-public-load-target-seconds: 3
    email-verification-token-ttl-hours: 24
    password-reset-token-ttl-minutes: 30
    refresh-token-ttl-days: 30
    maintenance-job-interval-ms: 3600000
    manager-invitation-expiry-days: 14

  # Mirrors application.yml. Left enabled so the wiring is exercised; the
  # ceilings are far above anything a test issues, and RateLimiterTest and
  # RateLimitFilterTest drive the limiter directly with their own policies.
  rate-limits:
    enabled: true
    login:              { limit: 10,  window-minutes: 15 }
    registration:       { limit: 5,   window-minutes: 60 }
    password-reset:     { limit: 5,   window-minutes: 60 }
    ai-suggestions:     { limit: 30,  window-minutes: 60 }
    uploads:            { limit: 100, window-minutes: 60 }
    public-item-view:   { limit: 60,  window-minutes: 1 }
    public-page-view:   { limit: 240, window-minutes: 1 }

  frontend:
    public-site-base-url: http://localhost:3000

  support:
    notification-email: support@example.com

  admin:
    bootstrap-email:
    bootstrap-password:

  uploads:
    # Under target/, so a test that does write a file leaves nothing in the
    # working tree. UploadServiceTest still uses its own @TempDir.
    directory: target/test-uploads
    max-file-size-mb: 5

  ai:
    # Blank on purpose: no test may reach OpenRouter, and AiSuggestionService
    # refuses with a clear message rather than calling out when the key is empty.
    openrouter-api-key:
    model: deepseek/deepseek-chat
