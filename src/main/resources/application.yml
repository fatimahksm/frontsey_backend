spring:
  application:
    name: dbwb-platform

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dbwb}
    username: ${DB_USERNAME:dbwb_user}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Sized on purpose rather than left at Hikari's default of 10. A public
      # page load holds a connection for the whole of its assembly, so ten
      # caps concurrent visitors at ten regardless of how many request threads
      # Tomcat has free. Twenty is comfortable for one node against a small
      # Postgres; raise it with the database's own max_connections in view,
      # not on its own.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      # Fail fast rather than piling up: a request that cannot get a connection
      # in three seconds should return an error, not hold a thread until the
      # user gives up.
      connection-timeout: 3000
      leak-detection-threshold: 20000

  jpa:
    hibernate:
      # Flyway owns schema evolution; Hibernate only validates it matches the entities.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # Menu import (9.8) is the only upload path today; sized for a large CSV, not media.
      max-file-size: ${MENU_IMPORT_MAX_FILE_SIZE_MB:10}MB
      max-request-size: ${MENU_IMPORT_MAX_FILE_SIZE_MB:10}MB

  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

# --- Centralized business configuration ---
# All BRD-derived numeric/behavioral constants live here (not scattered/hardcoded
# in services) so they can be tuned per environment without a code change.
dbwb:
  jwt:
    secret: ${JWT_SECRET:replace-this-with-a-long-random-secret-in-every-environment}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL_MIN:60}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  business-rules:
    subscription-grace-period-days: 3         # BR-SUB-006
    subscription-trial-days: 10               # free trial opened at first publish
    default-websites-per-owner: 3             # TBD-003 floor; a paid plan's maxWebsites overrides it, 0 = unlimited
    account-deletion-disable-window-days: 30  # BR-AUTH-006
    website-trash-retention-days: 30          # BR-DATA-004
    menu-item-trash-retention-days: 7         # BR-MENU-011
    analytics-event-retention-days: 365       # raw events discarded past this; 0 disables the purge
    website-public-load-target-seconds: 3     # BR-NFR-001
    email-verification-token-ttl-hours: 24    # BR-AUTH-002
    password-reset-token-ttl-minutes: 30      # BR-AUTH-004
    maintenance-job-interval-ms: 3600000      # 1 hour - BR-SUB-006/BR-ADM-004 background jobs
    manager-invitation-expiry-days: 14        # BR-MGR-007
    refresh-token-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}  # BR-AUTH-007

  # Request-rate ceilings. Nothing capped these endpoints before: login,
  # registration and password reset were unbounded, the public endpoints write
  # an analytics row per anonymous call, and every AI call spends real money.
  rate-limits:
    enabled: true
    login:              { limit: 10,  window-minutes: 15 }
    registration:       { limit: 5,   window-minutes: 60 }
    password-reset:     { limit: 5,   window-minutes: 60 }
    ai-suggestions:     { limit: 30,  window-minutes: 60 }
    uploads:            { limit: 100, window-minutes: 60 }
    public-item-view:   { limit: 60,  window-minutes: 1 }
    public-page-view:   { limit: 240, window-minutes: 1 }

  frontend:
    public-site-base-url: ${PUBLIC_SITE_BASE_URL:http://localhost:3000}

  support:
    # TBD-012: real support mailbox pending business decision.
    notification-email: ${SUPPORT_NOTIFICATION_EMAIL:support@example.com}

  admin:
    # One-time first-Super-Admin bootstrap (see AdminBootstrap) - blank means skipped.
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}

  uploads:
    # local | r2. Local writes to this container's disk: the files vanish when
    # it is replaced and a second instance cannot see them, so it is for
    # development only. r2 is Cloudflare R2 - the files outlive the container,
    # every instance sees the same ones, and a public bucket is served from
    # Cloudflare's network, which is the CDN as well.
    storage: ${UPLOAD_STORAGE:local}
    directory: ${UPLOAD_DIRECTORY:uploads}
    max-file-size-mb: ${UPLOAD_MAX_FILE_SIZE_MB:5}
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      bucket: ${R2_BUCKET:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      # The bucket's public address - its r2.dev URL, or a custom domain on it.
      # Required whenever storage is r2: without it an upload succeeds and then
      # shows as a broken picture on the live site.
      public-base-url: ${R2_PUBLIC_BASE_URL:}

  ai:
    openrouter-api-key: ${OPENROUTER_API_KEY:}
    model: ${OPENROUTER_MODEL:deepseek/deepseek-chat}

logging:
  level:
    com.dbwb.platform: INFO
